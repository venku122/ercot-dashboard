name: Deterministic validation and images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run on the selected ref
        required: true
        default: deterministic
        type: choice
        options:
          - deterministic
          - live-source

permissions:
  contents: read

concurrency:
  group: ercot-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-unit:
    name: static-unit
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:frontend
      - run: pnpm run test:receiver
      - run: pnpm run test:contracts
      - name: Verify secure Compose contracts
        run: |
          if env -u METRICS_API_KEY docker compose -f docker-compose.yml config --quiet; then
            echo "production Compose unexpectedly accepted a missing METRICS_API_KEY"
            exit 1
          fi
          METRICS_API_KEY=ci-contract-key docker compose -f docker-compose.yml config --quiet
          env -u METRICS_API_KEY docker compose -f docker-compose.dev.yml config --quiet

  collector-fixtures:
    name: collector-fixtures
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ercot-collector
          file: ercot-collector/Dockerfile
          target: collector-test
          load: true
          tags: ercot-collector-fixtures:ci
          cache-from: type=gha,scope=collector-fixtures
          cache-to: type=gha,mode=max,scope=collector-fixtures

  e2e-vri:
    name: e2e-vri
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic') }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project=chromium
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  mobile-webkit-vri:
    name: mobile-webkit-vri
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run populated mobile Chromium and WebKit coverage
        run: >-
          pnpm exec playwright test e2e/mobile.spec.ts e2e/mobile-lazy-regression.spec.ts e2e/mobile-regional-geography.spec.ts e2e/mobile-market-mechanics.spec.ts e2e/mobile-market-geography.spec.ts e2e/mobile-storage-operations.spec.ts e2e/mobile-storage-context-replay.spec.ts e2e/mobile-predictive-weather.spec.ts e2e/mobile-grid-event-timeline.spec.ts e2e/mobile-historical-context.spec.ts e2e/mobile-texas-grid.spec.ts e2e/mobile-external-context.spec.ts e2e/mobile-review-evidence.spec.ts
          --project=mobile
          --project=iphone-pro-max-webkit
          --project=compact-mobile
          --project=iphone-landscape-webkit
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-playwright-failure
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: performance
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:performance
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser performance budgets
        run: >-
          pnpm exec playwright test e2e/dashboard.spec.ts
          --grep "lazy mounting, browser long tasks, and heap remain bounded"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: performance-failure-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: docker-build (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic') }}
    needs: [static-unit, collector-fixtures, e2e-vri, mobile-webkit-vri, performance]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ercot-receiver
            context: .
            file: ercot-receiver/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  collector-platform-build:
    name: collector-native (${{ matrix.arch }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic') }}
    needs: [static-unit, collector-fixtures, e2e-vri, mobile-webkit-vri, performance]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Verify native builder architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Collector runner architecture does not match its target"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v4
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ercot-collector
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ercot-collector
          file: ercot-collector/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # PRs build and test locally; only main pushes architecture-specific digests.
          outputs: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=image,name=ghcr.io/{0}/ercot-collector,push-by-digest=true,name-canonical=true,push=true', github.repository_owner) || 'type=cacheonly' }}
          cache-from: type=gha,scope=ercot-collector-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ercot-collector-${{ matrix.arch }}
      - name: Export collector digest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/collector-digests"
          printf '%s\n' "$BUILD_DIGEST" > "$RUNNER_TEMP/collector-digests/$BUILD_ARCH.txt"
      - uses: actions/upload-artifact@v6
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: collector-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/collector-digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  collector-build:
    # Preserve the protected check name; skipped/failed platform jobs cannot turn it green.
    name: docker-build (ercot-collector)
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deterministic')) }}
    needs: [collector-platform-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Require both native collector builds
        env:
          BUILD_RESULT: ${{ needs.collector-platform-build.result }}
        run: python3 scripts/verify_collector_build.py --result "$BUILD_RESULT"
      - uses: docker/setup-buildx-action@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          images: ghcr.io/${{ github.repository_owner }}/ercot-collector
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          pattern: collector-digest-*
          path: ${{ runner.temp }}/collector-digests
          merge-multiple: true
      - name: Publish verified multi-architecture collector manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BUILD_RESULT: ${{ needs.collector-platform-build.result }}
          COLLECTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/ercot-collector
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          python3 scripts/verify_collector_build.py --result "$BUILD_RESULT" \
            --digests "$RUNNER_TEMP/collector-digests" --image "$COLLECTOR_IMAGE" \
            > "$RUNNER_TEMP/collector-manifest-inputs"
          mapfile -t sources < "$RUNNER_TEMP/collector-manifest-inputs"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$META_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          test "${#tag_args[@]}" -gt 0
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

  live-source-scheduled:
    name: live-source-scheduled
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'live-source') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t ercot-collector:live ercot-collector
      - run: >-
          docker run --rm --entrypoint deno ercot-collector:live
          run --allow-net --allow-env --cached-only live_verify.ts
