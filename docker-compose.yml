services:
  receiver:
    image: ercot-receiver:local
    build:
      context: .
      dockerfile: ercot-receiver/Dockerfile
    container_name: ercot-receiver
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      METRICS_API_KEY: "${METRICS_API_KEY:?METRICS_API_KEY must be set for production}"
      # CACHE_TTL_SECONDS: 10
      # CACHE_CONTROL_MAX_AGE: 30
      # CORS_ORIGINS_EXTRA: "https://example.com,https://other.example.com"
      # TRUST_PROXY: "1"
      # RATE_LIMIT_INGEST_RPM: 600
      # RATE_LIMIT_SERIES_RPM: 300
      # RATE_LIMIT_LATEST_RPM: 300
      # RATE_LIMIT_STATUS_RPM: 120
      # RATE_LIMIT_METRICS_RPM: 120
      # SERIES_BACKFILL_BATCH_SIZE: 1000
      # SERIES_BACKFILL_MAX_BATCHES: 10
    volumes:
      - ./ercot-receiver/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  collector:
    image: ercot-collector:local
    build:
      context: ./ercot-collector
      dockerfile: Dockerfile
    container_name: ercot-collector
    environment:
      METRICS_ENDPOINT: http://receiver:8080/api/ingest
      METRICS_API_KEY: "${METRICS_API_KEY:?METRICS_API_KEY must be set for production}"
      ERCOT_FORECAST_INGEST_ENABLED: "${ERCOT_FORECAST_INGEST_ENABLED:-false}"
      ERCOT_FORECAST_ENDPOINT: "${ERCOT_FORECAST_ENDPOINT:-http://receiver:8080/api/forecast-publications/ingest}"
      ERCOT_RENEWABLE_INGEST_ENABLED: "${ERCOT_RENEWABLE_INGEST_ENABLED:-false}"
      ERCOT_RENEWABLE_ENDPOINT: "${ERCOT_RENEWABLE_ENDPOINT:-http://receiver:8080/api/renewable-publications/ingest}"
      ERCOT_REGIONAL_RENEWABLE_INGEST_ENABLED: "${ERCOT_REGIONAL_RENEWABLE_INGEST_ENABLED:-false}"
      ERCOT_REGIONAL_RENEWABLE_ENDPOINT: "${ERCOT_REGIONAL_RENEWABLE_ENDPOINT:-http://receiver:8080/api/regional-renewable-publications/ingest}"
      ERCOT_MARKET_MECHANICS_INGEST_ENABLED: "${ERCOT_MARKET_MECHANICS_INGEST_ENABLED:-false}"
      ERCOT_MARKET_MECHANICS_ENDPOINT: "${ERCOT_MARKET_MECHANICS_ENDPOINT:-http://receiver:8080/api/market-mechanics-publications/ingest}"
      ERCOT_MARKET_GEOGRAPHY_INGEST_ENABLED: "${ERCOT_MARKET_GEOGRAPHY_INGEST_ENABLED:-false}"
      ERCOT_MARKET_GEOGRAPHY_ENDPOINT: "${ERCOT_MARKET_GEOGRAPHY_ENDPOINT:-http://receiver:8080/api/market-geography-publications/ingest}"
      NWS_WEATHER_INGEST_ENABLED: "${NWS_WEATHER_INGEST_ENABLED:-false}"
      NWS_WEATHER_ENDPOINT: "${NWS_WEATHER_ENDPOINT:-http://receiver:8080/api/predictive-weather/ingest}"
      NWS_WEATHER_USER_AGENT: "${NWS_WEATHER_USER_AGENT:-}"
      ERCOT_LONG_HORIZON_INGEST_ENABLED: "${ERCOT_LONG_HORIZON_INGEST_ENABLED:-false}"
      ERCOT_LONG_HORIZON_ENDPOINT: "${ERCOT_LONG_HORIZON_ENDPOINT:-http://receiver:8080/api/texas-grid/ingest}"
      EXTERNAL_CONTEXT_INGEST_ENABLED: "${EXTERNAL_CONTEXT_INGEST_ENABLED:-false}"
      EXTERNAL_CONTEXT_ENDPOINT: "${EXTERNAL_CONTEXT_ENDPOINT:-http://receiver:8080/api/external-context/ingest}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      ERCOT_API_USERNAME: "${ERCOT_API_USERNAME:-}"
      ERCOT_API_PASSWORD: "${ERCOT_API_PASSWORD:-}"
      ERCOT_PUBLIC_API_SUBSCRIPTION_KEY: "${ERCOT_PUBLIC_API_SUBSCRIPTION_KEY:-}"
      ERCOT_ESR_API_SUBSCRIPTION_KEY: "${ERCOT_ESR_API_SUBSCRIPTION_KEY:-}"
      # POWEROUTAGE_US_KEY: "your_poweroutage_key"
      # DATADOG_API_KEY: "optional-datadog-key"
      # DATADOG_APP_KEY: "optional-datadog-app-key"
    depends_on:
      receiver:
        condition: service_healthy
    restart: unless-stopped
